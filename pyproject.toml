[project]
name = "trio-http-proxy"
version = "0.1.0"
description = "Nano HTTP CONNECT proxy built on Trio and h11"
readme = "README.md"
authors = [
    { name = "Jeff C", email = "pub@jeffc.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "h11>=0.16.0",
    "trio>=0.34.0",
]

[project.scripts]
trio_http_proxy = "trio_http_proxy.proxy:main"
trio-http-proxy = "trio_http_proxy.proxy:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Python 3.14 loop/nursery branch reporting was fixed in 7.16.2.
    "coverage>=7.16.2",
    "hypothesis>=6.170.14",
    "pyreqwest>=0.13.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-trio>=0.8.0",
]

[tool.pytest]
trio_mode = true
# A hung test must fail, not stall CI. The slowest test takes under 0.5 s.
# pytest-timeout needs this as a string; a TOML integer is an INTERNALERROR.
timeout = "30"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.14"

