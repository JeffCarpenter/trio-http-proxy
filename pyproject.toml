[project]
name = "trio-http-proxy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeff C", email = "pub@jeffc.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "cashews[diskcache,speedup]>=7.5.0",
    "h11>=0.16.0",
    "trio>=0.34.0",
    "trio-asyncio>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

